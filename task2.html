<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ApexPlanet Task 2</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #0f0f13;
      --surface: #1a1a24;
      --border:  #2e2e40;
      --accent:  #7c6af7;
      --accent2: #f7a26a;
      --text:    #e8e6f0;
      --muted:   #7a7890;
      --green:   #4ecb8d;
      --red:     #f56565;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    nav {
      display: flex;                    
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
      font-family: 'Fira Code', monospace;
    }

    .nav-links {
      display: flex;                
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--accent); }

    .hero {
      text-align: center;
      padding: 4rem 2rem 3rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .hero h1 span { color: var(--accent); }

    .hero p {
      color: var(--muted);
      font-size: 1rem;
    }

   
    .main-grid {
      display: grid;                             
      grid-template-columns: 1fr;           
      gap: 2rem;
      max-width: 600px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }

    
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-size: 0.9rem;
      transition: border-color 0.2s;
      outline: none;
      resize: vertical;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    input.valid   { border-color: var(--green); }
    input.invalid { border-color: var(--red); }

    .error-msg {
      font-size: 0.75rem;
      color: var(--red);
      margin-top: 0.3rem;
      display: none;   
    }

    .success-msg {
      font-size: 0.75rem;
      color: var(--green);
      margin-top: 0.3rem;
      display: none;
    }

    .btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Sora', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }

    .btn:hover   { opacity: 0.88; }
    .btn:active  { transform: scale(0.98); }

    .btn-success {
      background: var(--green);
      display: none;  
    }

  
    .todo-input-row {
      display: flex;    
      gap: 0.6rem;
      margin-bottom: 1.2rem;
    }

    .todo-input-row input {
      flex: 1;
    }

    .btn-add {
      width: auto;
      padding: 0.75rem 1.2rem;
      font-size: 1.2rem;
      margin-top: 0;
      border-radius: 8px;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 280px;
      overflow-y: auto;
    }

    .todo-item {
      display: flex;            
      align-items: center;
      gap: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item.done span {
      text-decoration: line-through;
      color: var(--muted);
    }

    .todo-item span {
      flex: 1;
      font-size: 0.9rem;
    }


    .todo-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--green);
      cursor: pointer;
      flex-shrink: 0;
    }

   
    .btn-delete {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 4px;
      transition: color 0.2s;
      line-height: 1;
    }

    .btn-delete:hover { color: var(--red); }

    .todo-empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 1.5rem 0;
    }

    .todo-count {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    
    @media (max-width: 720px) {
      .main-grid {
        grid-template-columns: 1fr;   

      .nav-links {
        gap: 1rem;
      }

      nav {
        padding: 1rem;
      }
    }}

    @media (max-width: 480px) {
      .nav-links { display: none; } 
    }
  </style>
</head>
<body>


  <nav>
    <div class="nav-logo">ApexPlanet</div>
    <ul class="nav-links">
      <li><a href="#contact">Contact</a></li>
      <li><a href="#todo">To-Do</a></li>
    </ul>
  </nav>

 
  <div class="hero">
    <h1><span>Task 2</span></h1>
    <p>Forms · Validation · Flexbox · Grid · DOM Manipulation</p>
  </div>

 
  <div class="main-grid">

    <div class="card" id="contact">
      <div class="card-title">
        📬 Contact Form
        <span class="badge">HTML + CSS</span>
      </div>

      <form id="contactForm" novalidate>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="e.g. Sharmila Jambu" />
          <div class="error-msg" id="nameError">Name is required.</div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="e.g. hello@email.com" />
          <div class="error-msg"   id="emailError">Enter a valid email address.</div>
          <div class="success-msg" id="emailOk">Looks good!</div>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="4" placeholder="Write your message..."></textarea>
          <div class="error-msg" id="messageError">Message cannot be empty.</div>
        </div>

        <button type="submit" class="btn" id="submitBtn">Send Message</button>
        <button type="button" class="btn btn-success" id="successBtn">✓ Message Sent!</button>

      </form>
    </div>

    <div class="card" id="todo">
      <div class="card-title">
        ✅ To-Do List
        <span class="badge">JavaScript DOM</span>
      </div>

      <div class="todo-input-row">
        <input type="text" id="todoInput" placeholder="Add a new task..." />
        <button class="btn btn-add" onclick="addTask()">+</button>
      </div>

      <div class="todo-count" id="todoCount">0 tasks</div>

      <ul class="todo-list" id="todoList">
        <li class="todo-empty" id="emptyMsg">No tasks yet. Add one above!</li>
      </ul>

    </div>

  </div>


  <script>


    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();   

      let isValid = true;

      const name = document.getElementById('name');
      const nameError = document.getElementById('nameError');

      if (name.value.trim() === '') {
        name.className = 'invalid';
        nameError.style.display = 'block';
        isValid = false;
      } else {
        name.className = 'valid';
        nameError.style.display = 'none';
      }

      const email = document.getElementById('email');
      const emailError = document.getElementById('emailError');
      const emailOk    = document.getElementById('emailOk');

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailRegex.test(email.value.trim())) {
        email.className = 'invalid';
        emailError.style.display = 'block';
        emailOk.style.display    = 'none';
        isValid = false;
      } else {
        email.className = 'valid';
        emailError.style.display = 'none';
        emailOk.style.display    = 'block';
      }

      const message = document.getElementById('message');
      const messageError = document.getElementById('messageError');

      if (message.value.trim() === '') {
        message.style.borderColor = 'var(--red)';
        messageError.style.display = 'block';
        isValid = false;
      } else {
        message.style.borderColor = 'var(--green)';
        messageError.style.display = 'none';
      }

      if (isValid) {
        document.getElementById('submitBtn').style.display  = 'none';
        document.getElementById('successBtn').style.display = 'block';

        setTimeout(function() {
          document.getElementById('contactForm').reset();
          document.getElementById('submitBtn').style.display  = 'block';
          document.getElementById('successBtn').style.display = 'none';
          name.className    = '';
          email.className   = '';
          message.style.borderColor = '';
          emailOk.style.display = 'none';
        }, 3000);
      }
    });

    document.getElementById('todoInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addTask();
    });

    function addTask() {
      const input = document.getElementById('todoInput');
      const text  = input.value.trim();

      if (text === '') return;

      document.getElementById('emptyMsg').style.display = 'none';

      const li = document.createElement('li');
      li.className = 'todo-item';

      li.innerHTML = `
        <input type="checkbox" onchange="toggleDone(this)" />
        <span>${text}</span>
        <button class="btn-delete" onclick="deleteTask(this)">✕</button>
      `;

      document.getElementById('todoList').appendChild(li);

      input.value = '';
      input.focus();

      updateCount();
    }

    function toggleDone(checkbox) {
      const item = checkbox.parentElement;
      item.classList.toggle('done', checkbox.checked);
    }

    function deleteTask(btn) {
      const item = btn.parentElement;
      item.remove();

      const list = document.getElementById('todoList');
      const remaining = list.querySelectorAll('.todo-item');
      if (remaining.length === 0) {
        document.getElementById('emptyMsg').style.display = 'block';
      }

      updateCount();
    }

    function updateCount() {
      const items = document.querySelectorAll('.todo-item');
      const done  = document.querySelectorAll('.todo-item.done');
      const count = document.getElementById('todoCount');
      count.textContent = items.length + ' task' + (items.length !== 1 ? 's' : '')
        + (done.length > 0 ? ' · ' + done.length + ' done' : '');
    }

  </script>

</body>
</html>
